<div class="relative h-full">
  <a
    [routerLink]="'/domains/' + domain().id"
    class="group flex h-full min-h-[7.5rem] flex-col gap-4 rounded-lg border border-line bg-surface p-4 hover:bg-bg/60"
  >
    <span class="flex items-center gap-3.5">
      <amelu-action-icon name="domains" class="text-ink" />
      <span class="flex min-w-0 flex-1 flex-col">
        <span class="truncate text-[14px] font-medium group-hover:underline">{{ domain().name }}</span>
        <span class="text-[12px] text-muted">Added {{ domain().createdAt | date: 'd MMM y' }}</span>
      </span>
      <span [class]="badge()">{{ status().label }}</span>
      @if (score() !== null) {
        <span class="relative inline-flex size-9 flex-none items-center justify-center" [class]="scoreTone()" [title]="'DNS health: ' + health()?.matched + ' of ' + health()?.total + ' records verified'">
          <svg viewBox="0 0 32 32" class="absolute inset-0 -rotate-90" aria-hidden="true">
            <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-opacity="0.15" stroke-width="3" />
            <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" [attr.stroke-dasharray]="dash()" />
          </svg>
          <span class="text-[10px] font-bold">{{ score() }}</span>
          <span class="sr-only">% DNS health</span>
        </span>
      }
    </span>
    <span class="mt-auto flex items-center gap-1.5 border-t border-line pt-3 pr-16">
      <span class="mr-1 text-[11px] font-bold tracking-wide text-muted uppercase">DNS</span>
      @if (checks(); as rows) {
        @for (row of rows; track row.label) {
          <span
            class="inline-flex items-center gap-1 rounded px-1.5 py-0.5 text-[11px] font-bold tracking-wide"
            [class]="row.ok === null ? 'bg-bg text-muted' : row.ok ? 'bg-ok/15 text-ok' : 'bg-bad/15 text-bad'"
            [title]="row.label + (row.ok === null ? ' not checked' : row.ok ? ' verified' : ' not verified')"
          >
            <span class="size-1.5 rounded-full" [class]="row.ok === null ? 'bg-muted/50' : row.ok ? 'bg-ok' : 'bg-bad'"></span>
            {{ row.label }}
          </span>
        }
      } @else {
        <span class="h-4 w-32 animate-pulse rounded bg-bg"></span>
      }
    </span>
  </a>

  <!-- Outside the link: a button inside an <a> isn't valid, and clicks here mustn't open the domain. -->
  <span class="absolute right-3 bottom-3 flex items-center gap-0.5">
    <button
      type="button"
      class="inline-flex size-7 cursor-pointer items-center justify-center rounded-md hover:bg-bg"
      [class]="domain().favorite ? 'text-warn [&_svg]:fill-current' : 'text-muted hover:text-ink'"
      [attr.aria-label]="(domain().favorite ? 'Remove ' : 'Add ') + domain().name + (domain().favorite ? ' from favorites' : ' to favorites')"
      [attr.aria-pressed]="domain().favorite"
      [title]="favoriteFailed() ? 'Could not save, try again' : domain().favorite ? 'Remove from favorites' : 'Add to favorites'"
      (click)="toggleFavorite()"
    >
      <amelu-icon name="star" [size]="16" />
    </button>
    <ng-content select="[cardAction]" />
  </span>
</div>
