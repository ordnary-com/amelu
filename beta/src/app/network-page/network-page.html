<amelu-page-header title="Sending IPs">
  All addresses our mail server sends from. Each one has its own hostname, with matching reverse DNS.
  <button actions type="button" [class]="ui.outline" (click)="copy('all')">
    {{ copied() === 'all' ? 'Copied' : 'Copy all IPs' }}
  </button>
</amelu-page-header>

<div class="mb-4 flex flex-wrap items-center gap-2 text-[12px]">
  <span class="inline-flex items-center gap-1.5 rounded-full bg-surface px-2.5 py-1 font-medium ring-1 ring-line">
    <span class="size-1.5 rounded-full bg-accent"></span>{{ ips.length }} addresses
  </span>
  <span class="inline-flex items-center rounded-full bg-surface px-2.5 py-1 font-medium ring-1 ring-line">IPv4</span>
  <span class="inline-flex items-center rounded-full bg-surface px-2.5 py-1 font-medium ring-1 ring-line">Dedicated to Amelu</span>
</div>

<ul class="grid grid-cols-1 gap-3 sm:grid-cols-2 xl:grid-cols-3">
  @for (row of ips; track row.ip) {
    <li [class]="ui.card + ' group flex items-center gap-3 p-4'">
      <span class="flex size-9 flex-none items-center justify-center rounded-md bg-accent/10 text-accent">
        <amelu-icon name="globe" [size]="16" />
      </span>
      <span class="min-w-0 flex-1">
        <span class="block font-mono text-[15px] font-semibold tracking-tight">{{ row.ip }}</span>
        <span class="block truncate text-[12px] text-muted">{{ row.name }}</span>
      </span>
      <button
        type="button"
        class="flex size-8 flex-none cursor-pointer items-center justify-center rounded-md text-muted hover:bg-bg hover:text-ink"
        [attr.aria-label]="'Copy ' + row.ip"
        (click)="copy(row.ip)"
      >
        <amelu-icon [name]="copied() === row.ip ? 'check' : 'copy'" [size]="14" />
      </button>
    </li>
  }
</ul>
