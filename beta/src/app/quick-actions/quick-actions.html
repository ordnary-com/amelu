<h2 class="mb-3 text-[14px] font-bold">Quick actions</h2>
<div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-6">
  @for (action of actions(); track action.title) {
    <a
      [routerLink]="action.link"
      class="group flex items-center gap-3.5 rounded-lg border border-line bg-surface p-4 hover:bg-bg/60"
    >
      <amelu-action-icon [name]="action.icon" class="text-link" />
      <span class="flex min-w-0 flex-col">
        <span class="truncate text-[14px] font-medium group-hover:underline">{{ action.title }}</span>
        <span class="truncate text-[12px] text-muted">{{ action.subtitle }}</span>
      </span>
    </a>
  }
</div>
