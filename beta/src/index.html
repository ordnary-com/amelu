<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>Amelu</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <!-- Google Sans, the same fonts as Ordnary Web Services: Text for the interface, Display for headings. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Display:wght@400;500;700&family=Google+Sans+Text:wght@400;500;700&display=swap" />
    <!-- Before first paint, so a light-mode choice doesn't flash dark. -->
    <script>
      try {
        var theme = localStorage.getItem("amelu-theme");
        if (theme === "light" || (theme === "system" && !matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.remove("dark");
      } catch {}
    </script>
  </head>
  <body>
    <amelu-root></amelu-root>
  </body>
</html>
