<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>Amelu</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <!-- Google Sans, as on amelu.org. Only regular and medium: nothing is set in bold. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&display=swap" />
    <!-- Before first paint, so a light or variant theme doesn't flash dark (theme.ts). -->
    <script>
      try {
        var theme = localStorage.getItem("amelu-theme") || "dark";
        var accent = localStorage.getItem("amelu-accent");
        var classes = document.documentElement.classList;
        if (theme === "system") {
          var dark = matchMedia("(prefers-color-scheme: dark)").matches;
          if (matchMedia("(prefers-contrast: more)").matches) theme = dark ? "contrast-dark" : "contrast";
          else theme = dark ? "dark" : "light";
        }
        if (["dark", "dim", "black", "deep", "contrast-dark"].indexOf(theme) < 0) classes.remove("dark");
        if (["dim", "black", "deep", "white", "sepia", "contrast", "contrast-dark"].indexOf(theme) >= 0) classes.add("theme-" + theme);
        if (["purple", "green", "teal", "orange", "pink"].indexOf(accent) >= 0) classes.add("accent-" + accent);
      } catch {}
    </script>
  </head>
  <body>
    <amelu-root></amelu-root>
  </body>
</html>
