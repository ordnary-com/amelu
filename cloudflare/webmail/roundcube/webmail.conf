# The public hostname the Worker served (webmail.amelu.org, an organization's
# <name>.webmail.amelu.org or its own hostname): Roundcube builds its links
# and amelu_theme picks the branding from it. Direct hits without the header
# are the shared webmail.
map $http_x_forwarded_host $webmail_host {
    ""      webmail.amelu.org;
    default $http_x_forwarded_host;
}

# TLS front for Roundcube on 8443. The Worker connects here by the host's
# public name (the certificate's name); Roundcube itself must see the public
# webmail hostname so the links it builds are right.
server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/marduk.mx.amelu.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marduk.mx.amelu.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 30m;
    # Resolve the container name per request, so a recreated Roundcube
    # container (new address) does not leave nginx pointing at the old one.
    resolver 127.0.0.11 valid=10s;
    set $roundcube http://roundcube:80;
    location / {
        proxy_pass $roundcube;
        proxy_set_header Host $webmail_host;
        proxy_set_header X-Forwarded-Host $webmail_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_read_timeout 120s;
    }
}
