<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      This is the signed-in product dashboard, not marketing content - it
      must never compete with amelu.org for organic search ranking (same
      brand term, thin/duplicate title, content behind auth Google can't
      even see). amelu.org is the only surface that should be indexed.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/app.css" />
    <!--
      Stamps the stored theme (see src/context/ThemeContext.tsx) on <html>
      before the stylesheet paints. Doing this in React instead would show a
      flash of the light palette on every load for dark-theme users.
    -->
    <script>
      (function () {
        var stored = localStorage.getItem("amelu.theme");
        var dark =
          stored === "dark" ||
          ((stored === "system" || stored === null) && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <title>Amelu</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
