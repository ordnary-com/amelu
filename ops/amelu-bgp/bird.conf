# AS218905 (Ordnary) on the GRE tunnel to Lagrange (AS209735).
# We only announce our own prefixes and take no routes in: outbound traffic
# from them goes to Lagrange through table 100 (systemd-networkd).
router id 49.13.196.113;

protocol device {}

protocol static own4 {
  ipv4;
  route 89.106.70.0/24 unreachable;
}

protocol static own6 {
  ipv6;
  route 2a06:9801:f90::/48 unreachable;
}

protocol bgp lagrange4 {
  local 10.243.218.2 as 218905;
  neighbor 10.243.218.1 as 209735;
  ipv4 {
    import none;
    export where proto = "own4";
  };
}

protocol bgp lagrange6 {
  local fd:6fa2::2 as 218905;
  neighbor fd:6fa2::1 as 209735;
  ipv6 {
    import none;
    export where proto = "own6";
  };
}
