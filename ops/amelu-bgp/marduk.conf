# WireGuard to marduk (Amelu mail). 89.106.70.0/24 is routed to marduk, except
# 89.106.70.1, which stays here as the router address. Traffic from marduk with
# a 89.106.70.x source leaves via Lagrange (rule "from 89.106.70.0/24 lookup 100").
[Interface]
Address = 172.31.70.1/30
ListenPort = 51820
MTU = 1420
Table = off
PostUp = wg set %i private-key /etc/wireguard/marduk.key
PostUp = ip route add 89.106.70.0/24 dev %i
PostDown = ip route del 89.106.70.0/24 dev %i

[Peer]
PublicKey = m7xxsxBCcudgkhGPExpsMC9GksL2LMkdRpK39kJ//08=
AllowedIPs = 172.31.70.2/32, 89.106.70.0/24
