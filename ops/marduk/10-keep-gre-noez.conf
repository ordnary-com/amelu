# gre-noez adds ip rules and a table 20 route itself; without this a networkd restart
# (e.g. a systemd upgrade, as on 2026-11-05) deletes them and the noez IPs stop sending.
# Installed at /etc/systemd/networkd.conf.d/10-keep-gre-noez.conf on marduk.
[Network]
ManageForeignRoutingPolicyRules=no
ManageForeignRoutes=no
