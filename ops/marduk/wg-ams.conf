# WireGuard to rtr2-ams (Melbicom, AS218905 router). Owns the default route of
# table 30, so traffic from 89.106.70.0/24 (rule in bgp.conf) leaves through
# Melbicom. Lagrange (bgp.conf, rtr1-nbg) stays up for traffic coming in there.
[Interface]
Address = 172.31.72.2/30
MTU = 1420
Table = off
PostUp = wg set %i private-key /etc/wireguard/ams.key
PostUp = ip route replace default via 172.31.72.1 dev %i table 30 metric 100

[Peer]
PublicKey = bRL8mSxq/sU/DF49OiMzjjtKLi/O6qd4rn57iYns/XI=
Endpoint = 213.183.59.146:51820
AllowedIPs = 0.0.0.0/0
PersistentKeepalive = 25
