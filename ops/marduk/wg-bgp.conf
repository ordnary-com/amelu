# WireGuard to amelu-bgp (Hetzner, AS218905 router). Addresses from
# 89.106.70.0/24 used here send and receive through that tunnel; all other
# traffic keeps using OVH. Rules are added by hand, so networkd leaves them
# alone (/etc/systemd/networkd.conf.d, ManageForeignRoutingPolicyRules=no).
[Interface]
Address = 172.31.70.2/30
MTU = 1420
Table = off
PostUp = wg set %i private-key /etc/wireguard/bgp.key
PostUp = ip route add default via 172.31.70.1 dev %i table 30
PostUp = ip rule add from 89.106.70.0/24 lookup 30 priority 100
PostUp = ip addr add 89.106.70.2/32 dev %i
PostDown = ip rule del from 89.106.70.0/24 lookup 30 priority 100

[Peer]
PublicKey = 11Aguzg8y8Yxx7g6Lhs7c/6rIa8LNp9xEATB615DSxs=
Endpoint = 49.13.196.113:51820
AllowedIPs = 0.0.0.0/0
PersistentKeepalive = 25
