# WireGuard to rtr2-ams (iFog Amsterdam, AS218905 router). Preferred exit for
# 89.106.70.0/24 (no port 25 block); the failover check in
# /usr/local/bin/bgp-exit-check.sh keeps its table 30 route in line.
[Interface]
Address = 172.31.75.2/30
MTU = 1420
Table = off
PostUp = wg set %i private-key /etc/wireguard/ifog.key
PostUp = ip route replace default via 172.31.75.1 dev %i table 30 metric 40

[Peer]
PublicKey = peHkfKynRy2sHIPwgPs20/C5QbrzXHEbIAeTe9zCYyA=
Endpoint = 118.91.187.58:51820
AllowedIPs = 0.0.0.0/0
PersistentKeepalive = 25
