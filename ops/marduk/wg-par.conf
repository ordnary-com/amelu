# WireGuard to rtr1-par (Vultr Paris, AS218905 router). Second exit for
# 89.106.70.0/24 next to rtr1-ams (vultr.conf); the failover check in
# /usr/local/bin/bgp-exit-check.sh picks which one owns table 30.
[Interface]
Address = 172.31.74.2/30
MTU = 1420
Table = off
PostUp = wg set %i private-key /etc/wireguard/par.key
PostUp = ip route replace default via 172.31.74.1 dev %i table 30 metric 60

[Peer]
PublicKey = TlTX1sdgX+EwUkN2YOWczNNTfqWZKc8iDCoQdNbc9Hs=
Endpoint = 45.32.147.108:51820
AllowedIPs = 0.0.0.0/0
PersistentKeepalive = 25
