# WireGuard to rtr1-ams (Vultr, AS218905 router). Owns the default route of
# table 30 since 2026-11-17, so traffic from 89.106.70.0/24 (rule in bgp.conf)
# leaves through Vultr. rtr1-par (par.conf) takes over when this one is down.
[Interface]
Address = 172.31.73.2/30
MTU = 1420
Table = off
PostUp = wg set %i private-key /etc/wireguard/vultr.key
PostUp = ip route replace default via 172.31.73.1 dev %i table 30 metric 50

[Peer]
PublicKey = /QJGV5zSTtJDSA33lzrPHc9FZAOVpSudAhqdCaLT9xc=
Endpoint = 95.179.130.20:51820
AllowedIPs = 0.0.0.0/0
PersistentKeepalive = 25
