# AS218905 (Ordnary) on rtr1-ams, Vultr Amsterdam. Session to Vultr's route
# server AS64515 (multihop, password in /etc/bird/vultr-password, included below).
# We only announce our own /24 and take no routes in; traffic from the block
# comes back from marduk over WireGuard and leaves through Vultr (main table).
router id 95.179.130.20;

protocol device {}

protocol static own4 {
  ipv4;
  route 89.106.70.0/24 unreachable;
}

protocol bgp vultr4 {
  local 95.179.130.20 as 218905;
  neighbor 169.254.169.254 as 64515;
  multihop 2;
  include "/etc/bird/vultr-password.conf";
  ipv4 {
    import none;
    export where proto = "own4";
  };
}
