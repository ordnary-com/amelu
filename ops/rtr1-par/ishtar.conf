# WireGuard to ishtar (Ordnary mailcow, Hetzner fsn1). 89.106.70.200/29 is
# routed to ishtar; traffic from it leaves through this router (main table).
[Interface]
Address = 172.31.84.1/30
ListenPort = 51821
MTU = 1420
Table = off
PostUp = wg set %i private-key /etc/wireguard/ishtar.key
PostUp = ip route add 89.106.70.200/29 dev %i
PostDown = ip route del 89.106.70.200/29 dev %i

[Peer]
PublicKey = yEn73blAe46SRQQWUJTsXXD89ql4yJelqq1PQ4d5Xko=
AllowedIPs = 172.31.84.2/32, 89.106.70.200/29
