# WireGuard to marduk (Amelu mail). 89.106.70.0/24 is routed to marduk; traffic
# from marduk with a 89.106.70.x source leaves through Vultr Paris (main table).
[Interface]
Address = 172.31.74.1/30
ListenPort = 51820
MTU = 1420
Table = off
PostUp = wg set %i private-key /etc/wireguard/marduk.key
PostUp = ip route add 89.106.70.0/24 dev %i
PostDown = ip route del 89.106.70.0/24 dev %i

[Peer]
PublicKey = MGFyvKwD1e7I5aEH9OP11XVo/VWfZ5Nu4ZUQWzGT5FI=
AllowedIPs = 172.31.74.2/32, 89.106.70.0/24
