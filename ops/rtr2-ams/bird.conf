# AS218905 (Ordnary) to Melbicom (AS56630), directly connected on eth0.
# Announces only our own /24 and takes no routes in: traffic from the block
# comes back from marduk over WireGuard and leaves through Melbicom (main table).
router id 213.183.59.146;

protocol device {}

protocol static own4 {
  ipv4;
  route 89.106.70.0/24 unreachable;
}

protocol bgp melbicom4 {
  local 213.183.59.146 as 218905;
  neighbor 213.183.59.1 as 56630;
  ipv4 {
    import none;
    export where proto = "own4";
  };
}
