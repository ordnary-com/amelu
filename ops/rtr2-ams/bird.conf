# AS218905 (Ordnary) on rtr2-ams, iFog Amsterdam. Direct session to iFog AS34927.
# We only announce our own /24 and take no routes in; traffic from the block
# comes back from marduk over WireGuard and leaves through iFog (main table).
router id 118.91.187.58;

protocol device {}

protocol static own4 {
  ipv4;
  route 89.106.70.0/24 unreachable;
}

protocol bgp ifog4 {
  local 118.91.187.58 as 218905;
  neighbor 118.91.187.1 as 34927;
  ipv4 {
    import none;
    export where proto = "own4";
  };
}
