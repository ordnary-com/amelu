# WireGuard to marduk (Amelu mail). 89.106.70.0/24 is routed to marduk; traffic
# from marduk with a 89.106.70.x source leaves through iFog (main table).
[Interface]
Address = 172.31.75.1/30
ListenPort = 51820
MTU = 1420
Table = off
PostUp = wg set %i private-key /etc/wireguard/marduk.key
PostUp = ip route add 89.106.70.0/24 dev %i
PostDown = ip route del 89.106.70.0/24 dev %i

[Peer]
PublicKey = rQlDUc4dODjAvfdQlgBytlBGyn1wx32ZhIP30eq77w8=
AllowedIPs = 172.31.75.2/32, 89.106.70.0/24
