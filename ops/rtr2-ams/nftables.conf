#!/usr/sbin/nft -f
# rtr2-ams: SSH, ICMP and WireGuard in; BGP from iFog; forwarding only for our own block.
flush ruleset
table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;
    ct state established,related accept
    iif lo accept
    meta l4proto { icmp, ipv6-icmp } accept
    tcp dport 22 accept
    udp dport 51820 accept
    udp dport 51821 accept
    ip saddr 118.91.187.1 tcp sport 179 accept
    ip saddr 118.91.187.1 tcp dport 179 accept
    iifname marduk accept
    iifname ishtar accept
  }
  chain forward {
    type filter hook forward priority filter; policy drop;
    iifname marduk ip saddr 89.106.70.0/24 accept
    iifname ishtar ip saddr 89.106.70.200/29 accept
    oifname ishtar ip daddr 89.106.70.200/29 accept
    oifname marduk ip daddr 89.106.70.0/24 accept
  }
}
