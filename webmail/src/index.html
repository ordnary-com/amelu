<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>Amelu Webmail</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <!-- Before first paint, so a light-mode choice doesn't flash dark. -->
    <script>
      try {
        var theme = localStorage.getItem('amelu-theme');
        if (
          theme === 'light' ||
          (theme === 'system' && !matchMedia('(prefers-color-scheme: dark)').matches)
        )
          document.documentElement.classList.remove('dark');
      } catch {}
    </script>
  </head>
  <body>
    <amelu-root></amelu-root>
  </body>
</html>
